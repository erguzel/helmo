[project]
name = "helmo"
version = "0.2.2"
description = "Helm-kubernetes-registry managing cli tool."
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "erguzel", email = "olgunerguzel@gmail.com" }
]
requires-python = ">=3.12.1"
dependencies = [
    "click==8.3.1",
    "httpx>=0.28.1",
    "kubernetes>=34.1.0",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv==1.2.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
helmo = "helmo.cli:cli"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
