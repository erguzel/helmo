name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly dependency advisory check
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # --locked fails if pyproject.toml and uv.lock have drifted apart
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest

  audit:
    # Kept off push/pull_request on purpose: a newly published advisory should
    # open an alert, not turn an unrelated pull request red.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Export locked runtime dependencies
        run: >
          uv export --locked --no-hashes --no-dev --no-emit-project
          --format requirements-txt -o requirements.txt

      # --disable-pip is what keeps this job runnable: without it pip-audit
      # resolves by building a venv from the uv-managed CPython that setup-uv
      # installs, and creating that venv fails on the runner (exit 127).
      # --no-deps alone does not skip that step, it only makes --disable-pip legal.
      # pip-audit is pinned because an unpinned tool in a weekly job breaks on
      # a schedule nobody is watching; the advisory data is still fetched live,
      # so pinning the tool does not stale the results.
      # --strict turns a silently unaudited dependency into a failure.
      - name: Check against known advisories
        run: >
          uvx pip-audit@2.10.1 -r requirements.txt
          --no-deps --disable-pip --strict
