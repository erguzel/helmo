version: 2

updates:
  # ci.yml pins actions by commit SHA, which never picks up upstream fixes on
  # its own -- Dependabot is what keeps those pins from silently ageing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # one pull request for routine bumps; majors still arrive on their own
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # kubernetes 36 pulls in aiohttp and a new transitive tree, and the client
      # it changes is mocked end to end in the test suite -- a green CI run says
      # nothing about it. Revisit once integration coverage can exercise
      # gc_collect against a disposable cluster.
      - dependency-name: "kubernetes"
        update-types: ["version-update:semver-major"]
